name: db-migrate

# Applies committed Prisma migrations to production.
#
# The release path (scripts/deploy-vercel.sh) deliberately does NOT migrate:
# the deploy is a prebuilt upload and the production DATABASE_URL is a Vercel
# "Sensitive" variable, which the platform withholds from `vercel env pull`
# and `vercel env run` alike. Actions already holds the credential for the
# nightly backup, so the migration runs here instead of on someone's laptop —
# which also means it is logged, repeatable and reviewable.
#
# Manual trigger only. There is no `push` trigger on purpose: schema changes
# must be applied deliberately, in the operator's chosen order relative to the
# deploy, never as a side effect of merging.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm applying migrations to PRODUCTION'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'migrate'
        run: |
          echo "::error::Refusing to run — type 'migrate' in the confirm input."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Status first, so the log records exactly what the database looked like
      # before anything was applied — the audit trail for a production change.
      - name: Migration status (before)
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: bunx prisma migrate status || true

      - name: Apply migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: bunx prisma migrate deploy

      - name: Migration status (after)
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: bunx prisma migrate status
