name: db-seed

# Seeds initial demo and admin data to production database.
#
# Production DATABASE_URL is stored in GitHub Secrets (NEON_DATABASE_URL).
# Super admin and demo passwords must be supplied as inputs and satisfy NIST SP 800-63B-4.
# Manual trigger only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed" to confirm seeding PRODUCTION database'
        required: true
        default: ""
      super_admin_email:
        description: 'Super admin email'
        required: false
        default: "admin@pharmachainglobal.com"
      super_admin_password:
        description: 'Super admin password'
        required: true
        default: "SuperAdmin#Pharma2026!Global"
      demo_password:
        description: 'Demo users password'
        required: true
        default: "PharmaChain#Demo2026!Secure"

permissions:
  contents: read

concurrency:
  group: db-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check confirmation phrase
        if: inputs.confirm != 'seed'
        run: |
          echo "::error::Refusing to run — type 'seed' in the confirm input."
          exit 1

      - name: Keep database host and passwords out of the log
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPER_ADMIN_PASSWORD: ${{ inputs.super_admin_password }}
          DEMO_PASSWORD: ${{ inputs.demo_password }}
        run: |
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-z]+://([^@]*@)?([^/:?]+).*#\2#')
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi
          if [ -n "$SUPER_ADMIN_PASSWORD" ]; then echo "::add-mask::$SUPER_ADMIN_PASSWORD"; fi
          if [ -n "$DEMO_PASSWORD" ]; then echo "::add-mask::$DEMO_PASSWORD"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run database seed
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SEED_SUPER_ADMIN_EMAIL: ${{ inputs.super_admin_email }}
          SEED_SUPER_ADMIN_PASSWORD: ${{ inputs.super_admin_password }}
          SEED_DEMO_PASSWORD: ${{ inputs.demo_password }}
        run: bun prisma/seed.ts

      - name: Verify seeded records
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          bun -e '
          import { prisma } from "./src/index";
          async function verify() {
            const users = await prisma.user.findMany({
              select: {
                email: true,
                name: true,
                isSuperAdmin: true,
                status: true,
                membership: { select: { role: true, company: { select: { name: true } } } },
              },
              orderBy: { email: "asc" },
            });
            console.log("\n=== SEEDED USERS IN PRODUCTION ===");
            for (const u of users) {
              const role = u.isSuperAdmin ? "SUPER_ADMIN" : (u.membership?.role || "NO_ROLE");
              const comp = u.membership?.company?.name || "(Platform)";
              console.log(`- ${u.email} | ${u.name} | Role: ${role} | Status: ${u.status} | Company: ${comp}`);
            }

            const [companies, categories, params, listings, rfqs, orders] = await Promise.all([
              prisma.company.count(),
              prisma.category.count(),
              prisma.systemParameter.count(),
              prisma.listing.count(),
              prisma.rfq.count(),
              prisma.order.count(),
            ]);

            console.log("\n=== DATABASE COUNTS ===");
            console.log(`Users: ${users.length}`);
            console.log(`Companies: ${companies}`);
            console.log(`Categories: ${categories}`);
            console.log(`System Parameters: ${params}`);
            console.log(`Listings: ${listings}`);
            console.log(`RFQs: ${rfqs}`);
            console.log(`Orders: ${orders}`);

            if (users.length === 0 || companies === 0) {
              throw new Error("Verification failed: no users or companies found");
            }
          }
          verify().catch((e) => { console.error(e); process.exit(1); }).finally(() => prisma.$disconnect());
          '
