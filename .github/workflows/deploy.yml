name: Deploy

# Assembles and deploys the combined Next.js web + NestJS API bundle to Vercel
# production after CI passes on `main` (or on manual dispatch).
#
# Vercel's native Git integration is disabled in `vercel.json` because the API
# serverless function (`api/backend.func`) needs its native dependencies
# (Prisma RHEL engine, @node-rs/argon2) and `sin1` region pinning assembled via
# `scripts/deploy-vercel.sh`.
#
# Database migrations remain explicit (`db-migrate.yml`): if a release adds a
# migration, run `db-migrate.yml` before merging to `main`.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys in parallel or cancel one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_6scESWZ4tyV13XFGBnliQEBC
      VERCEL_PROJECT_ID: prj_NGQTZoO7rPRF9YsPylYuITnmrWnI
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build & deploy prebuilt bundle to Vercel
        run: bash scripts/deploy-vercel.sh

      - name: Verify live health endpoints
        run: |
          set -euo pipefail
          for origin in "https://www.pharmachainglobal.com" "https://global-pharmachain.vercel.app"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              body=$(curl -fsS --max-time 20 "${origin}/api/backend/health/ready" || true)
              if echo "$body" | grep -q '"ok":true'; then
                echo "${origin}: ready ($body)"
                ok=1
                break
              fi
              echo "${origin}: attempt ${attempt} not ready yet, retrying in 5s..."
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check failed on ${origin}"
              exit 1
            fi
          done
