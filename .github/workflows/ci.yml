name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs can pick the runner image, to try the next ubuntu-latest
  # before GitHub moves the label (Ubuntu 26.04: 2026-10-19 to 2026-11-19)
  # or to fall back to the previous one if the move breaks something.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options: [ubuntu-latest, ubuntu-26.04, ubuntu-24.04]
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  # The runner is part of the key so an image trial never cancels a push run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes prisma generate)
        run: bunx turbo run build
        env:
          # build needs no live services; dummy values keep env validation happy
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-only-secret-not-used-at-runtime-0000"
          API_URL: "http://localhost:3001"

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Test
        run: bunx turbo run test
